# CI/CD: runs on every push and pull request to main.
#   1. test   - the full pytest suite (uses synthetic data, no raw CSV needed)
#   2. docker - builds the serving image and checks the running container
#               (/health, /model-info, /predict and the /ui web page)
#   3. push   - on pushes to main only: publishes the image to Docker Hub
#
# Repository secrets needed for the push job (Settings > Secrets and
# variables > Actions): DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access
# token created in Docker Hub, not your password).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch at a time
concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull request runs, but let a run on main finish so an
  # image is never left half-published
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Same Python minor version the model was trained with
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # -ra lists every skipped/failed test at the end of the log; the XML
      # report feeds the summary shown on the run page
      - name: Run tests
        run: pytest tests -v -ra --junitxml=pytest-report.xml

      # Show the test counts and slowest tests on the run's summary page
      - name: Publish test summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          if not os.path.exists("pytest-report.xml"):
              raise SystemExit("## Tests\n\nNo test report was produced.")
          suite = ET.parse("pytest-report.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          total = int(suite.get("tests"))
          failed = int(suite.get("failures")) + int(suite.get("errors"))
          skipped = int(suite.get("skipped"))
          cases = list(suite.iter("testcase"))
          print("## Test results\n")
          print("| Total | Passed | Failed | Skipped | Duration |")
          print("| ----- | ------ | ------ | ------- | -------- |")
          print(f"| {total} | {total - failed - skipped} | {failed} | "
                f"{skipped} | {float(suite.get('time')):.0f}s |\n")
          print("### Slowest tests\n")
          print("| Test | Seconds |")
          print("| ---- | ------- |")
          for c in sorted(cases, key=lambda c: -float(c.get("time")))[:5]:
              print(f"| `{c.get('classname')}::{c.get('name')}` | "
                    f"{float(c.get('time')):.1f} |")
          EOF

  docker:
    # Only build the image once the tests pass
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -f docker/Dockerfile -t churn-api .

      - name: Start the container
        run: docker run -d --name churn-api -p 8000:8000 churn-api

      # Wait until the API answers, then score one customer end to end
      - name: Smoke test the running container
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8000/model-info
          # The web page: /ui redirects to /ui/, so follow redirects and
          # require a final 200
          test "$(curl -sL -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ui)" = 200
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"gender":"Female","SeniorCitizen":0,"Partner":"Yes","Dependents":"No","tenure":1,"PhoneService":"No","MultipleLines":"No phone service","InternetService":"DSL","OnlineSecurity":"No","OnlineBackup":"Yes","DeviceProtection":"No","TechSupport":"No","StreamingTV":"No","StreamingMovies":"No","Contract":"Month-to-month","PaperlessBilling":"Yes","PaymentMethod":"Electronic check","MonthlyCharges":29.85,"TotalCharges":29.85}'

      - name: Show container logs on failure
        if: failure()
        run: docker logs churn-api

  push:
    # Publish only after both the tests and the container check pass, and only
    # for pushes to main (pull requests also trigger this workflow)
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Seven characters, like `git rev-parse --short`; used as the version tag
      - name: Compute the short commit SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Two tags: :latest always points at the newest image; :<sha> is
      # permanent, so any earlier version can be pulled or rolled back to
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false # keep the Docker Hub tag list clean
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/customer-churn-mlops:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/customer-churn-mlops:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
